                value: 89
        latestPrediction: null

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with EVIDEA extensions.
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri, description: URI identifying the problem type. }
        title: { type: string, description: Short human-readable summary. }
        status: { type: integer, description: HTTP status code. }
        detail: { type: string, description: Explanation of this occurrence. }
        code:
          type: string
          description: Stable machine-readable error code. Clients should branch on this, not on `title`.
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_DEACTIVATED
            - FORBIDDEN
            - NOT_FOUND
            - EMAIL_ALREADY_USED
            - PATIENT_ARCHIVED
            - PREDICTION_RUN_IN_PROGRESS
            - INVITATION_INVALID
            - DOCTOR_NOT_INVITED
            - CANNOT_DEACTIVATE_SELF
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - NO_ACTIVE_MODEL
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
        requestId: { type: string, description: Correlation ID; quote it when reporting a problem. }
        errors:
          type: array
          description: Field errors (only for `VALIDATION_ERROR`).
          items:
            type: object
            required: [field, message, code]
            properties:
              field: { type: string, description: "Field path in camelCase, for example `labReports.0.results.1.value`." }
              message: { type: string }
              code: { type: string }
        existingRunId:
          type: string
          format: uuid
          description: Only for `PREDICTION_RUN_IN_PROGRESS`; the open run to poll instead.

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    Sex:
      type: string
      enum: [male, female, other, unknown]
      description: Biological sex (DB CHECK `chk_patients_sex`).
    Role:
      type: string
      enum: [clinician, admin]
    DoctorStatus:
      type: string
      enum: [invited, active, deactivated]
      description: |
        Derived. `deactivated` if `deactivated_at` is set; `invited` if the doctor has not accepted an
        invitation yet; otherwise `active`.
    PatientStatus:
      type: string
      enum: [active, archived]
      description: Derived from `patients.deleted_at`.
    PersonName:
      type: string
      minLength: 2
      maxLength: 100
      description: Letters (any alphabet), spaces, apostrophes and hyphens. Leading and trailing spaces are trimmed.
    Email:
      type: string
      format: email
      maxLength: 254
    Phone:
      type: string
      maxLength: 30
      pattern: '^\+?[0-9\s()-]+$'
      description: 7 to 15 digits; may start with `+` and contain spaces, brackets and hyphens.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 128, format: password }

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200, description: Token from the invitation link. }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,128}$'
          description: |
            At least 8 characters with at least one uppercase letter, one lowercase letter,
            one digit and one special character (any character other than a Latin letter or digit).

    InvitationIssued:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }

    DoctorRef:
      type: object
      required: [id, name, surname]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }

    Doctor:
      type: object
      description: |
        Account of a clinician or admin (`doctors_and_admin`). `password_hash` is never exposed.
        The UI shows the role label as the doctor's position.
      required: [id, name, surname, birthDate, sex, email, phoneNumber, role, status, avatarUrl, createdOn, deactivatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        birthDate: { type: [string, 'null'], format: date }
        sex:
          oneOf:
            - { $ref: '#/components/schemas/Sex' }
            - { type: 'null' }
        email: { type: string, format: email }
        phoneNumber: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/DoctorStatus' }
        avatarUrl: { type: [string, 'null'], description: Relative URL of the avatar image. }
        createdOn: { type: string, format: date, description: Account creation date (stored as DATE). }
        deactivatedAt: { type: [string, 'null'], format: date-time }

    DoctorCreate:
      type: object
      additionalProperties: false
      required: [name, surname, email, role]
      properties:
        name: { $ref: '#/components/schemas/PersonName' }
        surname: { $ref: '#/components/schemas/PersonName' }
        birthDate:
          type: [string, 'null']
          format: date
          description: Optional. Age must be 18 to 100.
        sex:
          oneOf:
            - { $ref: '#/components/schemas/Sex' }
            - { type: 'null' }
        email: { $ref: '#/components/schemas/Email' }
        phoneNumber:
          oneOf:
            - { $ref: '#/components/schemas/Phone' }
            - { type: 'null' }
        role: { $ref: '#/components/schemas/Role' }

    DoctorPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Doctor' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Patient:
      type: object
      description: Patient record (`patients`). The UI shows a short form of `id` as the patient code.
      required: [id, name, surname, birthDate, age, sex, email, phoneNumber, status, photoUrl, lastVisitAt, createdOn, archivedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        birthDate: { type: string, format: date }
        age: { type: integer, minimum: 0, description: Full years today. }
        sex: { $ref: '#/components/schemas/Sex' }
        email: { type: string, format: email }
        phoneNumber: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PatientStatus' }
        photoUrl: { type: [string, 'null'] }
        lastVisitAt:
          type: [string, 'null']
          format: date-time
          description: Creation time of the most recent case; `null` if there are no cases.
        createdOn: { type: string, format: date }
        archivedAt: { type: [string, 'null'], format: date-time }

    PatientListItem:
      type: object
      required: [id, name, surname, age, sex, status, photoUrl, lastVisitAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        age: { type: integer, minimum: 0 }
        sex: { $ref: '#/components/schemas/Sex' }
        status: { $ref: '#/components/schemas/PatientStatus' }
        photoUrl: { type: [string, 'null'] }
        lastVisitAt: { type: [string, 'null'], format: date-time }

    PatientPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PatientListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PatientCreate:
      type: object
      additionalProperties: false
      required: [name, surname, birthDate, sex, email]
      properties:
        name: { $ref: '#/components/schemas/PersonName' }
        surname: { $ref: '#/components/schemas/PersonName' }
        birthDate: { type: string, format: date, description: Not in the future; age at most 130. }
        sex: { $ref: '#/components/schemas/Sex' }
        email: { $ref: '#/components/schemas/Email' }
        phoneNumber:
          oneOf:
            - { $ref: '#/components/schemas/Phone' }
            - { type: 'null' }

    PatientReplace:
      description: Complete patient data for `PUT`. Same rules as `PatientCreate`, but every field is required.
      type: object
      additionalProperties: false
      required: [name, surname, birthDate, sex, email, phoneNumber]
      properties:
        name: { $ref: '#/components/schemas/PersonName' }
        surname: { $ref: '#/components/schemas/PersonName' }
        birthDate: { type: string, format: date, description: Not in the future; age at most 130. }
        sex: { $ref: '#/components/schemas/Sex' }
        email: { $ref: '#/components/schemas/Email' }
        phoneNumber:
          oneOf:
            - { $ref: '#/components/schemas/Phone' }
            - { type: 'null' }

    ImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG, JPEG or WebP, at most 2 MB.
    ImageRef:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Relative URL with a cache-busting version. }
    Binary:
      type: string
      format: binary

    AnamnesisFields:
      type: object
      properties:
        chiefComplaint: { type: string, minLength: 10, maxLength: 2000, description: At least 10 characters (DQ-20). }
        symptomsDuration: { type: [string, 'null'], maxLength: 200 }
        clinicalNotes: { type: [string, 'null'], maxLength: 10000 }
        familyHistory: { type: [string, 'null'], maxLength: 5000 }
        medications: { type: [string, 'null'], maxLength: 5000 }
        pastMedicalHistory: { type: [string, 'null'], maxLength: 5000 }
        allergies: { type: [string, 'null'], maxLength: 5000 }

    AnamnesisCreate:
      description: Do not enter patient identifiers (names, IDs) in free text (DQ-27).
      allOf:
        - $ref: '#/components/schemas/AnamnesisFields'
        - type: object
          required: [chiefComplaint]

    AnamnesisReplace:
      description: Complete anamnesis for `PUT`; every field is required, optional ones may be `null`.
      allOf:
        - $ref: '#/components/schemas/AnamnesisFields'
        - type: object
          required: [chiefComplaint, symptomsDuration, clinicalNotes, familyHistory, medications, pastMedicalHistory, allergies]

    Anamnesis:
      allOf:
        - $ref: '#/components/schemas/AnamnesisFields'
        - type: object
          required: [id, chiefComplaint, symptomsDuration, clinicalNotes, familyHistory, medications, pastMedicalHistory, allergies, createdBy, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdBy: { $ref: '#/components/schemas/DoctorRef' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    VitalSignsFields:
      type: object
      properties:
        weightKg: { type: [number, 'null'], minimum: 0.1, maximum: 500, description: 'kg, one decimal' }
        systolicBpMmhg: { type: [integer, 'null'], minimum: 20, maximum: 300 }
        diastolicBpMmhg: { type: [integer, 'null'], minimum: 20, maximum: 300 }
        heartRateBpm: { type: [integer, 'null'], minimum: 10, maximum: 300 }
        respiratoryRate: { type: [integer, 'null'], minimum: 1, maximum: 120, description: Breaths per minute. }
        bodyTempCelsius: { type: [number, 'null'], minimum: 25, maximum: 45 }
        spo2Percent: { type: [integer, 'null'], minimum: 0, maximum: 100 }

    VitalSignsCreate:
      description: At least one measurement is required.
      allOf:
        - $ref: '#/components/schemas/VitalSignsFields'
        - type: object
          minProperties: 1

    VitalSigns:
      allOf:
        - $ref: '#/components/schemas/VitalSignsFields'
        - type: object
          required: [id, weightKg, systolicBpMmhg, diastolicBpMmhg, heartRateBpm, respiratoryRate, bodyTempCelsius, spo2Percent, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    LabValue:
      description: Number for `numeric` analytes, boolean for `boolean`, string for `text`.
      oneOf:
        - { type: number }
        - { type: boolean }
        - { type: string, minLength: 1, maxLength: 500 }

    LabReportCreate:
      type: object
      additionalProperties: false
      required: [panelId, collectedAt, results]
      properties:
        panelId: { type: string, format: uuid }
        collectedAt: { type: string, format: date-time, description: Sample collection time; not in the future. }
        results:
          type: array
          minItems: 1
          maxItems: 100
          description: One result per analyte; analytes must belong to the panel.
          items:
            type: object
            additionalProperties: false
            required: [analyteId, value]
            properties:
              analyteId: { type: string, format: uuid }
              value: { $ref: '#/components/schemas/LabValue' }

    AnalyteRef:
      type: object
      required: [id, code, name, unit, dataType]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unit: { type: [string, 'null'] }
        dataType: { type: string, enum: [numeric, text, boolean] }

    LabReport:
      type: object
      required: [id, panel, collectedAt, createdAt, results]
      properties:
        id: { type: string, format: uuid }
        panel:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        collectedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            required: [id, analyte, value]
            properties:
              id: { type: string, format: uuid }
              analyte: { $ref: '#/components/schemas/AnalyteRef' }
              value: { $ref: '#/components/schemas/LabValue' }

    CaseCreate:
      type: object
      additionalProperties: false
      required: [anamnesis]
      properties:
        anamnesis: { $ref: '#/components/schemas/AnamnesisCreate' }
        vitalSigns: { $ref: '#/components/schemas/VitalSignsCreate' }
        labReports:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LabReportCreate' }

    LatestPrediction:
      type: object
      description: Top-1 hypothesis of the latest completed run (view `v_case_latest_prediction`).
      required: [runId, completedAt, topDiseaseName, topScore]
      properties:
        runId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        topDiseaseName: { type: string }
        topScore: { type: number, minimum: 0, maximum: 1 }

    CaseSummary:
      type: object
      required: [id, patientId, createdAt, createdBy, chiefComplaint, latestPrediction]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/DoctorRef' }
        chiefComplaint: { type: string }
        latestPrediction:
          oneOf:
            - { $ref: '#/components/schemas/LatestPrediction' }
            - { type: 'null' }

    CaseSummaryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    CaseDetail:
      type: object
      required: [id, patientId, createdAt, updatedAt, createdBy, anamnesis, vitalSigns, labReports, latestPrediction]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/DoctorRef' }
        anamnesis: { $ref: '#/components/schemas/Anamnesis' }
        vitalSigns:
          type: array
          items: { $ref: '#/components/schemas/VitalSigns' }
        labReports:
          type: array
          items: { $ref: '#/components/schemas/LabReport' }
        latestPrediction:
          oneOf:
            - { $ref: '#/components/schemas/LatestPrediction' }
            - { type: 'null' }

    LabCatalog:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [id, code, name, panels]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              panels:
                type: array
                items:
                  type: object
                  required: [id, code, name, analytes]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }
                    analytes:
                      type: array
                      items: { $ref: '#/components/schemas/AnalyteRef' }

    RunStatus:
      type: string
      enum: [pending, processing, completed, failed, unsupported]
      description: Moves only forward (DB trigger).

    ModelVersionRef:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Model name; the demo stub is labelled `(demo)`. }
        version: { type: string }

    PredictionRunSummary:
      type: object
      required: [id, caseId, status, modelVersion, initiatedBy, createdAt, startedAt, completedAt, errorMessage]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        modelVersion: { $ref: '#/components/schemas/ModelVersionRef' }
        initiatedBy: { $ref: '#/components/schemas/DoctorRef' }
        createdAt: { type: string, format: date-time, description: When the run was requested (column added by migration M12). }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        errorMessage: { type: [string, 'null'], description: Set for `failed` and `unsupported` runs. }

    PredictionRunSummaryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PredictionRunSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PredictionRun:
      allOf:
        - $ref: '#/components/schemas/PredictionRunSummary'
        - type: object
          required: [hypotheses]
          properties:
            hypotheses:
              type: array
              description: Ordered by rank; empty unless `completed`.
              items: { $ref: '#/components/schemas/Hypothesis' }

    Hypothesis:
      type: object
      required: [id, rank, score, disease]
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer, minimum: 1 }
        score: { type: number, minimum: 0, maximum: 1, description: "Model confidence, not a probability of diagnosis." }
        disease: { $ref: '#/components/schemas/Disease' }

    Disease:
      type: object
      description: Orphanet disease (© INSERM / Orphadata, CC BY 4.0).
      required: [id, orphaCode, name, icdCode, inheritanceType]
      properties:
        id: { type: string, format: uuid }
        orphaCode: { type: string }
        name: { type: string }
        icdCode: { type: [string, 'null'] }
        inheritanceType: { type: [string, 'null'] }

    Explanation:
      type: object
      required: [id, method, summary, data, createdAt]
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [shap, lime] }
        summary: { type: [string, 'null'] }
        data:
          type: object
          description: Feature contributions; structure depends on the model version.
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
