openapi: 3.1.0
info:
  title: EVIDEA API
  version: 1.0.0-draft
  summary: Clinical decision support API for rare disease hypotheses.
  description: |
    REST API of EVIDEA. Clinicians manage patients and cases and request ranked
    rare-disease hypotheses; administrators manage clinician accounts.

    **Status:** DRAFT contract (Phase 5). Not implemented yet.

    ## Conventions
    - Base path `/api/v1`. JSON request and response bodies use **camelCase**.
    - Timestamps are ISO 8601 with time zone (`date-time`); calendar dates are `date`.
    - IDs are UUIDs.
    - Lists are paginated with `page` / `pageSize` (offset pagination).
    - Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable `code`.
    - Every response carries `X-Request-ID`; send your own value to correlate logs.

    ## Authentication
    `POST /auth/login` sets an `HttpOnly; Secure; SameSite=Strict` cookie `evidea_session`
    holding a signed JWT (lifetime 8 hours). Browsers send it automatically.
    On every request the server also checks that the account is not deactivated.
    State-changing requests with an `Origin` header that is not an allowed origin are rejected (CSRF protection).

    EVIDEA supports clinical reasoning; it does not replace a clinician's diagnosis.
  license:
    name: Proprietary (diploma project)
    identifier: LicenseRef-EVIDEA
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose (nginx in front of the API)
  - url: http://localhost:5173/api/v1
    description: Frontend dev server (Vite proxy to the API)
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Login, logout and invitation acceptance.
  - name: Me
    description: The signed-in user.
  - name: Doctors
    description: Clinician and admin accounts. Admin only, except reading avatars.
  - name: Patients
    description: Patient records. Clinicians and admins see all patients.
  - name: Cases
    description: Clinical cases with anamnesis, vital signs and lab reports.
  - name: Lab catalog
    description: Reference catalog of lab categories, panels and analytes.
  - name: Predictions
    description: Asynchronous prediction runs, ranked hypotheses and explanations.
  - name: Health
    description: Liveness and readiness probes.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Verifies email and password and sets the session cookie.
        A deactivated account gets `403 ACCOUNT_DEACTIVATED` only when the password is correct.
        An invited doctor who has not set a password yet cannot sign in (`401`).
        Limited to 5 failed attempts per minute per IP and email (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: sarah.chen@clinic.example, password: correct-horse-battery }
      responses:
        '200':
          description: Signed in. Returns the current user.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema: { type: string }
              example: evidea_session=eyJhbGciOi...; Path=/api; HttpOnly; Secure; SameSite=Strict; Max-Age=28800
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              examples:
                clinicianDoctor: { $ref: '#/components/examples/ClinicianDoctor' }
        '401':
          description: Wrong email or password.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/invalid-credentials
                title: Invalid email or password
                status: 401
                code: INVALID_CREDENTIALS
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
        '403':
          description: Account deactivated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/account-deactivated
                title: Account deactivated
                status: 403
                detail: Your account has been deactivated. Contact an administrator.
                code: ACCOUNT_DEACTIVATED
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Clears the session cookie. Idempotent; succeeds without a session too.
      security: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema: { type: string }
              example: evidea_session=; Path=/api; HttpOnly; Secure; SameSite=Strict; Max-Age=0

  /auth/invitations/accept:
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: Set a password from an invitation
      description: |
        The invited doctor opens the link from the invitation email and sets a password.
        The token is single-use and expires 72 hours after it was issued.
        An unknown, used or expired token returns the same error, so tokens cannot be probed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
            example:
              token: q3V9cJ2m8xZr0bLwT5yH1nKdA7sE4fGu6iOpQ2wE9rT
              password: Clinic#2026
      responses:
        '204':
          description: Password set. The doctor can sign in.
        '400':
          description: Invalid, used or expired token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/invitation-invalid
                title: Invitation is invalid or expired
                status: 400
                code: INVITATION_INVALID
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Me]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              examples:
                clinicianDoctor: { $ref: '#/components/examples/ClinicianDoctor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/avatar:
    put:
      tags: [Me]
      operationId: uploadMyAvatar
      summary: Upload or replace own avatar
      description: PNG, JPEG or WebP, at most 2 MB. The file type is checked by content, not by name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
      responses:
        '200':
          description: Avatar stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageRef' }
              example: { url: "/api/v1/doctors/3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01/avatar?v=1763740800" }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Me]
      operationId: deleteMyAvatar
      summary: Remove own avatar
      responses:
        '204': { description: Avatar removed (or there was none). }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /doctors:
    get:
      tags: [Doctors]
      operationId: listDoctors
      summary: List doctors
      description: Admin only. Sorted by surname, then name.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          description: Filter by account status.
          schema: { $ref: '#/components/schemas/DoctorStatus' }
        - name: role
          in: query
          description: Filter by role.
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: A page of doctors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorPage' }
              example:
                items:
                  - id: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01
                    name: Sarah
                    surname: Chen
                    birthDate: '1985-04-12'
                    sex: female
                    email: sarah.chen@clinic.example
                    phoneNumber: null
                    role: clinician
                    status: active
                    avatarUrl: null
                    createdOn: '2026-01-10'
                    deactivatedAt: null
                meta: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Doctors]
      operationId: createDoctor
      summary: Create a doctor and send an invitation
      description: |
        Admin only. Creates the account without a usable password and emails a one-time
        invitation link (`{FRONTEND_URL}/accept-invitation?token=...`). The account status is `invited`
        until the doctor sets a password. If sending the email fails, the account is still created;
        use `POST /doctors/{doctorId}/invitations` to resend.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorCreate' }
            example:
              name: Tomas
              surname: Kazlauskas
              birthDate: '1988-06-14'
              sex: male
              email: tomas.kazlauskas@clinic.example
              phoneNumber: '+370 612 45 648'
              role: clinician
      responses:
        '201':
          description: Doctor created, invitation sent.
          headers:
            Location:
              description: URL of the new doctor.
              schema: { type: string }
              example: /api/v1/doctors/8b2e4f60-1a3c-4d5e-8f70-9a1b2c3d4e5f
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              example:
                id: 8b2e4f60-1a3c-4d5e-8f70-9a1b2c3d4e5f
                name: Tomas
                surname: Kazlauskas
                birthDate: '1988-06-14'
                sex: male
                email: tomas.kazlauskas@clinic.example
                phoneNumber: '+370 612 45 648'
                role: clinician
                status: invited
                avatarUrl: null
                createdOn: '2026-11-21'
                deactivatedAt: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already used by another doctor (case-insensitive).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/email-already-used
                title: Email already used
                status: 409
                code: EMAIL_ALREADY_USED
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
        '422': { $ref: '#/components/responses/ValidationError' }

  /doctors/{doctorId}:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Doctors]
      operationId: getDoctor
      summary: Get a doctor
      description: Admin only.
      responses:
        '200':
          description: The doctor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              examples:
                clinicianDoctor: { $ref: '#/components/examples/ClinicianDoctor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /doctors/{doctorId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    post:
      tags: [Doctors]
      operationId: deactivateDoctor
      summary: Deactivate a doctor
      description: |
        Admin only. The doctor can no longer sign in; existing sessions stop working on the next request.
        Cases created by the doctor are kept. Idempotent. An admin cannot deactivate their own account.
      responses:
        '200':
          description: The deactivated doctor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              examples:
                deactivatedDoctor: { $ref: '#/components/examples/DeactivatedDoctor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Admin tried to deactivate their own account.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/cannot-deactivate-self
                title: You cannot deactivate your own account
                status: 409
                code: CANNOT_DEACTIVATE_SELF
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c

  /doctors/{doctorId}/activate:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    post:
      tags: [Doctors]
      operationId: activateDoctor
      summary: Reactivate a doctor
      description: Admin only. Clears the deactivation. Idempotent.
      responses:
        '200':
          description: The reactivated doctor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
              examples:
                clinicianDoctor: { $ref: '#/components/examples/ClinicianDoctor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /doctors/{doctorId}/invitations:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    post:
      tags: [Doctors]
      operationId: resendInvitation
      summary: Resend the invitation
      description: |
        Admin only. Issues a new invitation token, emails it and invalidates earlier unused tokens.
        Only for doctors with status `invited`.
      responses:
        '202':
          description: New invitation issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssued' }
              example: { expiresAt: '2026-11-24T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The doctor already has a password or is deactivated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/doctor-not-invited
                title: Doctor is not awaiting an invitation
                status: 409
                code: DOCTOR_NOT_INVITED
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c

  /doctors/{doctorId}/avatar:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Doctors]
      operationId: getDoctorAvatar
      summary: Get a doctor's avatar image
      description: Any signed-in user.
      responses:
        '200':
          description: Image bytes.
          content:
            image/png: { schema: { $ref: '#/components/schemas/Binary' } }
            image/jpeg: { schema: { $ref: '#/components/schemas/Binary' } }
            image/webp: { schema: { $ref: '#/components/schemas/Binary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List and search patients
      description: |
        Returns a compact view (no email or phone; data minimisation).
        `search` matches name, surname or email, case-insensitive substring.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          description: Active (default) or archived patients.
          schema: { $ref: '#/components/schemas/PatientStatus' }
        - name: sort
          in: query
          description: Sort order. `-` means descending.
          schema:
            type: string
            enum: [name, -createdOn, -lastVisitAt]
            default: name
      responses:
        '200':
          description: A page of patients. `meta.totalItems` feeds the sidebar counter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }
              example:
                items:
                  - id: 6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12
                    name: Alberto
                    surname: Ripley
                    age: 28
                    sex: male
                    status: active
                    photoUrl: /api/v1/patients/6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12/photo?v=1763740800
                    lastVisitAt: '2026-11-18T09:30:00Z'
                meta: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create a patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreate' }
            example:
              name: Alberto
              surname: Ripley
              birthDate: '1998-01-25'
              sex: male
              email: alberto.ripley@mail.example
              phoneNumber: '+370 612 45 648'
      responses:
        '201':
          description: Patient created.
          headers:
            Location:
              description: URL of the new patient.
              schema: { type: string }
              example: /api/v1/patients/6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
              examples:
                activePatient: { $ref: '#/components/examples/ActivePatient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Another active patient has this email (case-insensitive).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/email-already-used
                title: Email already used
                status: 409
                code: EMAIL_ALREADY_USED
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Get a patient
      responses:
        '200':
          description: The patient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
              examples:
                activePatient: { $ref: '#/components/examples/ActivePatient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Patients]
      operationId: replacePatient
      summary: Replace patient data
      description: |
        Full replacement: send every field, including `phoneNumber` (`null` clears it).
        Archived patients cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientReplace' }
            example:
              name: Alberto
              surname: Ripley
              birthDate: '1998-01-25'
              sex: male
              email: alberto.ripley@mail.example
              phoneNumber: '+370 600 00 001'
      responses:
        '200':
          description: Updated patient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
              examples:
                activePatient: { $ref: '#/components/examples/ActivePatient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PatientConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/{patientId}/archive:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    post:
      tags: [Patients]
      operationId: archivePatient
      summary: Archive a patient
      description: |
        Irreversible. Archived patients stay readable with their cases and predictions,
        but cannot be edited and cannot get new cases or prediction runs. Idempotent.
      responses:
        '200':
          description: The archived patient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
              examples:
                archivedPatient: { $ref: '#/components/examples/ArchivedPatient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/anonymize:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    post:
      tags: [Patients]
      operationId: anonymizePatient
      summary: Anonymize a patient (right to erasure)
      description: |
        Admin only. Irreversible. Calls the database procedure `anonymize_patient`: replaces name,
        surname, email and phone, truncates the birth date to the year, archives the patient and
        removes the photo. Cases and predictions stay linked. Free-text anamnesis is not changed.
      responses:
        '200':
          description: The anonymized patient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
              example:
                id: 6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12
                name: ANONYMIZED
                surname: ANONYMIZED
                birthDate: '1998-01-01'
                age: 28
                sex: male
                email: anon-6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12@anonymized.invalid
                phoneNumber: null
                status: archived
                photoUrl: null
                lastVisitAt: '2026-11-18T09:30:00Z'
                createdOn: '2026-02-01'
                archivedAt: '2026-11-21T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/photo:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatientPhoto
      summary: Get the patient photo
      responses:
        '200':
          description: Image bytes.
          content:
            image/png: { schema: { $ref: '#/components/schemas/Binary' } }
            image/jpeg: { schema: { $ref: '#/components/schemas/Binary' } }
            image/webp: { schema: { $ref: '#/components/schemas/Binary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Patients]
      operationId: uploadPatientPhoto
      summary: Upload or replace the patient photo
      description: PNG, JPEG or WebP, at most 2 MB. Not allowed for archived patients.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
      responses:
        '200':
          description: Photo stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageRef' }
              example: { url: "/api/v1/patients/6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12/photo?v=1763740800" }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PatientConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      operationId: deletePatientPhoto
      summary: Remove the patient photo
      responses:
        '204': { description: Photo removed (or there was none). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/cases:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Cases]
      operationId: listPatientCases
      summary: List the patient's cases
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of case summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummaryPage' }
              example:
                items:
                  - id: c4a1e2b3-5d6f-4a7b-8c9d-0e1f2a3b4c5d
                    patientId: 6d0f8a1e-2b3c-4d4e-9f5a-6b7c8d9e0f12
                    createdAt: '2026-11-18T09:30:00Z'
                    createdBy: { id: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01, name: Sarah, surname: Chen }
                    chiefComplaint: Progressive muscle weakness and fatigue
                    latestPrediction:
                      runId: f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
                      completedAt: '2026-11-18T09:31:12Z'
                      topDiseaseName: Glycogen storage disease due to acid maltase deficiency
                      topScore: 0.62
                meta: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Cases]
      operationId: createCase
      summary: Create a case
      description: |
        Creates the case, its anamnesis, optional vital signs and optional lab reports
        in **one transaction**: either everything is saved or nothing.
        Lab results are checked against the catalog: each analyte must belong to the report's panel,
        and the value type must match the analyte's `dataType`.
        Not allowed for archived patients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseCreate' }
            example:
              anamnesis:
                chiefComplaint: Progressive muscle weakness and fatigue
                symptomsDuration: 3 months
                clinicalNotes: Difficulty climbing stairs, proximal weakness of the lower limbs.
                familyHistory: null
                medications: None
                pastMedicalHistory: null
                allergies: None known
              vitalSigns:
                weightKg: 82.5
                systolicBpMmhg: 128
                diastolicBpMmhg: 84
                heartRateBpm: 76
                respiratoryRate: 16
                bodyTempCelsius: 36.8
                spo2Percent: 98
              labReports:
                - panelId: 00000000-0000-0000-0000-000000000602
                  collectedAt: '2026-11-18T08:00:00Z'
                  results:
                    - { analyteId: 00000000-0000-0000-0000-000000000702, value: 1520 }
                    - { analyteId: 00000000-0000-0000-0000-000000000703, value: 89 }
      responses:
        '201':
          description: Case created.
          headers:
            Location:
              description: URL of the new case.
              schema: { type: string }
              example: /api/v1/cases/c4a1e2b3-5d6f-4a7b-8c9d-0e1f2a3b4c5d
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
              examples:
                caseDetail: { $ref: '#/components/examples/CaseDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PatientConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: Get a case with all clinical data
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
              examples:
                caseDetail: { $ref: '#/components/examples/CaseDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cases/{caseId}/anamnesis:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    put:
      tags: [Cases]
      operationId: replaceAnamnesis
      summary: Replace the case anamnesis
      description: |
        Full replacement: send every field (`null` clears an optional one). Earlier prediction runs are not affected: each run keeps a snapshot
        of its inputs. Not allowed for archived patients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnamnesisReplace' }
            example:
              chiefComplaint: Progressive muscle weakness and fatigue
              symptomsDuration: 3 months
              clinicalNotes: Difficulty climbing stairs, proximal weakness of the lower limbs.
              familyHistory: Maternal uncle with similar symptoms
              medications: None
              pastMedicalHistory: null
              allergies: None known
      responses:
        '200':
          description: Updated anamnesis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anamnesis' }
              examples:
                anamnesis: { $ref: '#/components/examples/Anamnesis' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PatientConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /lab-catalog:
    get:
      tags: [Lab catalog]
      operationId: getLabCatalog
      summary: Get the active lab catalog
      description: Active categories, panels and analytes as one tree. Used to build the lab entry form.
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabCatalog' }
              example:
                categories:
                  - id: 00000000-0000-0000-0000-000000000502
                    code: BIO
                    name: Biochemistry
                    panels:
                      - id: 00000000-0000-0000-0000-000000000602
                        code: MUSCLE
                        name: Muscle enzymes
                        analytes:
                          - { id: 00000000-0000-0000-0000-000000000702, code: CK, name: Creatine Kinase, unit: U/L, dataType: numeric }
                          - { id: 00000000-0000-0000-0000-000000000703, code: ALT, name: Alanine aminotransferase, unit: U/L, dataType: numeric }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /cases/{caseId}/prediction-runs:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Predictions]
      operationId: listCasePredictionRuns
      summary: List prediction runs of a case
      description: Newest first. Hypotheses are not included; open a run for details.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionRunSummaryPage' }
              example:
                items:
                  - id: f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
                    caseId: c4a1e2b3-5d6f-4a7b-8c9d-0e1f2a3b4c5d
                    status: completed
                    modelVersion: { id: 0f1e2d3c-4b5a-4968-8776-5a4b3c2d1e0f, name: evidea-stub (demo), version: 0.1.0 }
                    initiatedBy: { id: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01, name: Sarah, surname: Chen }
                    createdAt: '2026-11-18T09:31:00Z'
                    startedAt: '2026-11-18T09:31:02Z'
                    completedAt: '2026-11-18T09:31:12Z'
                    errorMessage: null
                meta: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Predictions]
      operationId: createPredictionRun
      summary: Request a prediction
      description: |
        Queues a prediction run for the case with the active model and returns immediately
        with status `pending`. A background worker processes it; poll `GET /prediction-runs/{runId}`
        (recommended interval: the `Retry-After` value).

        The server builds a de-identified input snapshot from the case (anamnesis text, vital signs,
        lab values). Names, emails and phone numbers are never included.

        **Idempotency:** only one open (`pending` or `processing`) run per case is allowed. A repeated
        request returns `409 PREDICTION_RUN_IN_PROGRESS` with `existingRunId`, so a double click never creates two runs.
      responses:
        '202':
          description: Run queued.
          headers:
            Location:
              description: URL to poll.
              schema: { type: string }
              example: /api/v1/prediction-runs/f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
            Retry-After:
              description: Suggested polling interval in seconds.
              schema: { type: integer }
              example: 2
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionRun' }
              example:
                id: f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
                caseId: c4a1e2b3-5d6f-4a7b-8c9d-0e1f2a3b4c5d
                status: pending
                modelVersion: { id: 0f1e2d3c-4b5a-4968-8776-5a4b3c2d1e0f, name: evidea-stub (demo), version: 0.1.0 }
                initiatedBy: { id: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01, name: Sarah, surname: Chen }
                createdAt: '2026-11-18T09:31:00Z'
                startedAt: null
                completedAt: null
                errorMessage: null
                hypotheses: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A run is already open for this case, or the patient is archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                runInProgress:
                  summary: Run already open
                  value:
                    type: https://evidea.example/problems/prediction-run-in-progress
                    title: A prediction run is already in progress for this case
                    status: 409
                    code: PREDICTION_RUN_IN_PROGRESS
                    existingRunId: f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
                    requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
                patientArchived: { $ref: '#/components/examples/PatientArchivedProblem' }
        '503':
          description: No active model is registered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://evidea.example/problems/no-active-model
                title: No active prediction model
                status: 503
                code: NO_ACTIVE_MODEL
                requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c

  /prediction-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Predictions]
      operationId: getPredictionRun
      summary: Get a prediction run with ranked hypotheses
      description: |
        `hypotheses` is empty until the run is `completed`. `failed` runs carry `errorMessage`;
        `unsupported` means the model cannot handle this input.
        Scores are model confidence values, **not probabilities of diagnosis**.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionRun' }
              example:
                id: f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c
                caseId: c4a1e2b3-5d6f-4a7b-8c9d-0e1f2a3b4c5d
                status: completed
                modelVersion: { id: 0f1e2d3c-4b5a-4968-8776-5a4b3c2d1e0f, name: evidea-stub (demo), version: 0.1.0 }
                initiatedBy: { id: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c01, name: Sarah, surname: Chen }
                createdAt: '2026-11-18T09:31:00Z'
                startedAt: '2026-11-18T09:31:02Z'
                completedAt: '2026-11-18T09:31:12Z'
                errorMessage: null
                hypotheses:
                  - id: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                    rank: 1
                    score: 0.62
                    disease:
                      id: 1d2c3b4a-5e6f-4789-8a9b-0c1d2e3f4a5b
                      orphaCode: 'ORPHA:365'
                      name: Glycogen storage disease due to acid maltase deficiency
                      icdCode: E74.0
                      inheritanceType: Autosomal recessive
                  - id: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6e
                    rank: 2
                    score: 0.21
                    disease:
                      id: 1d2c3b4a-5e6f-4789-8a9b-0c1d2e3f4a5c
                      orphaCode: 'ORPHA:368'
                      name: Glycogen storage disease due to muscle glycogen phosphorylase deficiency
                      icdCode: null
                      inheritanceType: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hypotheses/{hypothesisId}/explanations:
    parameters:
      - name: hypothesisId
        in: path
        required: true
        description: Hypothesis ID.
        schema: { type: string, format: uuid }
    get:
      tags: [Predictions]
      operationId: listHypothesisExplanations
      summary: Get explanations of a hypothesis
      description: Feature contributions (SHAP or LIME). They show associations, not causal proof.
      responses:
        '200':
          description: Explanations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Explanation' }
              example:
                items:
                  - id: 7e6d5c4b-3a2f-4e1d-8c0b-9a8f7e6d5c4b
                    method: shap
                    summary: Elevated creatine kinase and proximal weakness contributed most.
                    data:
                      textFeatures:
                        - { token: proximal weakness, shapValue: 0.34 }
                      labFeatures:
                        - { analyte: Creatine Kinase, value: 1520, unit: U/L, shapValue: 0.41 }
                      disclaimer: Feature associations, not causal proof.
                    createdAt: '2026-11-18T09:31:12Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: Liveness probe
      description: The process is running. Does not touch the database.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }

  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe
      description: The API can serve requests (database reachable).
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, checks: { database: ok } }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: unavailable, checks: { database: unavailable } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: evidea_session
      description: Signed JWT set by `POST /auth/login`. HttpOnly; not readable from JavaScript.

  headers:
    XRequestId:
      description: Correlation ID. Echoes the request's `X-Request-ID` or a generated UUID.
      schema: { type: string }

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Case-insensitive substring search, 2 to 100 characters.
      schema: { type: string, minLength: 2, maxLength: 100 }
    DoctorId:
      name: doctorId
      in: path
      required: true
      description: Doctor ID.
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      description: Patient ID.
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: Case ID.
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      description: Prediction run ID.
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: No valid session (missing, expired or invalid cookie, or the account was deactivated).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/unauthenticated
            title: Authentication required
            status: 401
            code: UNAUTHENTICATED
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    Forbidden:
      description: Signed in, but the role does not allow this action, or the request Origin is not allowed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: This action requires the admin role.
            code: FORBIDDEN
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/not-found
            title: Resource not found
            status: 404
            code: NOT_FOUND
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    PatientConflict:
      description: The patient is archived, or another active patient already has the email.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            patientArchivedProblem: { $ref: '#/components/examples/PatientArchivedProblem' }
    ValidationError:
      description: The request is syntactically valid JSON but breaks validation rules.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/validation-error
            title: Validation failed
            status: 422
            code: VALIDATION_ERROR
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
            errors:
              - { field: birthDate, message: Date of birth cannot be in the future, code: date_in_future }
              - { field: email, message: Enter a valid email address, code: invalid_email }
    TooManyRequests:
      description: Too many attempts. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
          example: 60
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/rate-limited
            title: Too many attempts
            status: 429
            code: RATE_LIMITED
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    PayloadTooLarge:
      description: The upload is larger than 2 MB.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/payload-too-large
            title: File is too large
            status: 413
            code: PAYLOAD_TOO_LARGE
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    UnsupportedMediaType:
      description: The file is not PNG, JPEG or WebP.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/unsupported-media-type
            title: Unsupported file type
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c
    InternalError:
      description: Unexpected server error. The details are logged under `requestId`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://evidea.example/problems/internal-error
            title: Internal server error
            status: 500
            code: INTERNAL_ERROR
            requestId: 4b1d2c3e-0f9a-4e8b-a7c6-5d4e3f2a1b0c

