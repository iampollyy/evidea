name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: evidea
          POSTGRES_DB: evidea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:evidea@localhost:5432/evidea
      EVIDEA_APP_PASSWORD: ci-app-password
      TEST_DATABASE_URL: postgresql://postgres:evidea@localhost:5432/evidea
      TEST_DATABASE_APP_URL: postgresql://evidea_app:ci-app-password@localhost:5432/evidea
      REQUIRE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/db/requirements.txt
            backend/app/requirements-dev.txt

      - name: Apply migrations and create the application role
        working-directory: backend/db
        run: |
          pip install -r requirements.txt
          python scripts/manage.py migrate

      - name: Install backend
        working-directory: backend/app
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        working-directory: backend/app
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: backend/app
        run: mypy

      - name: Tests with coverage gate (80%)
        working-directory: backend/app
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Schemathesis contract and example tests
        env:
          DATABASE_APP_URL: postgresql://evidea_app:ci-app-password@localhost:5432/evidea
          JWT_SECRET: ci-contract-test-secret-0123456789-abcdefgh
          COOKIE_SECURE: "false"
          EVIDEA_USER_PASSWORD: "Contract#2026"
        run: |
          set -euo pipefail
          cd backend/app
          python -m evidea.cli create-user \
            --email contract-admin@clinic.example --name Contract --surname Admin --role admin
          uvicorn evidea.main:create_app --factory --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/evidea-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/evidea-api.log"
            exit 1
          fi

          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/evidea-login.headers" --output /dev/null \
            --header "Content-Type: application/json" \
            --data '{"email":"contract-admin@clinic.example","password":"Contract#2026"}' \
            http://127.0.0.1:8000/api/v1/auth/login
          cookie="$(grep -i '^set-cookie:' "$RUNNER_TEMP/evidea-login.headers" \
            | head -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/;.*//;s/^[[:space:]]*//')"
          test -n "$cookie"

          schemathesis run ../../docs/reference/openapi.yaml \
            --url http://127.0.0.1:8000/api/v1 \
            --header "Cookie: $cookie" \
            --phases examples,coverage,fuzzing \
            --workers 1 \
            --exclude-checks negative_data_rejection,positive_data_acceptance,unsupported_method,allow_header_conformance \
            --max-time 120

      - name: Dependency audit
        working-directory: backend/app
        run: pip-audit -r requirements.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/app/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint the API contract
        run: npx --yes @redocly/cli@2.82.0 lint openapi.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose --env-file .env.example build
