[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidea-api"
version = "1.0.0"
description = "EVIDEA backend: REST API and prediction worker"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["evidea"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/evidea/modules/*/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["evidea"]
strict = true
plugins = ["pydantic.mypy"]
